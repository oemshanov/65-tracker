<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>65 tracker</title>
<style>
@font-face { font-family: "Rubik"; font-weight: 300 900; src: url(/fonts/rubik-latin.woff2) format("woff2"); }
@font-face { font-family: "Montserrat"; font-weight: 100 900; src: url(/fonts/montserrat-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: "Montserrat"; font-weight: 100 900; src: url(/fonts/montserrat-cyrillic.woff2) format("woff2"); unicode-range: U+0400-045F; }

/* Панель из строки меню: те же токены, что у таймлайна, — одна система. */

@media (prefers-color-scheme: dark) { :root {
  --ground: #121214; --card: #212125; --well: #2b2b30; --line: #34343a; --edge: rgba(255,255,255,.07); --ink: #f4f4f5; --muted: #a3a5aa; --soft: #7d7f84;

* { box-sizing: border-box; }

/* Панель без прокрутки: всё помещается, лишнее — счётчиком «ещё N». */
.wrap { height: 100%; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 7px; overflow: hidden; }
.top { display: flex; align-items: center; gap: 8px; padding: 2px 2px 8px; }
.brand { display: flex; align-items: center; gap: 3px; font: 500 17px/1 "Rubik", var(--display); letter-spacing: -.02em; }
.brand svg { width: 28px; height: 28px; }
.sp { flex: 1; }
.rec { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--card); font-size: 13px; }
.rec i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.rec.paused i { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent); }
.rec svg { width: 10px; height: 10px; opacity: .6; }
.card { background: var(--card); border-radius: 20px; padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--edge); }
.card.access { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 8px 8px 14px; background: var(--warn-bg); box-shadow: none; flex: none; }
.card.access b span { font-weight: 400; color: var(--muted); }
.card.access b { color: var(--warn); font-weight: 600; }
.card.access .pill { flex: none; height: 30px; background: var(--warn); color: #fff; }
.card.access.upd { background: var(--blue-soft); } .card.access.upd b { color: var(--blue-text); } .card.access.upd .pill { background: var(--blue); }
/* Страховка: если места мало, сжимается «Уйдёт в Jira», а «Открыть таймлайн» всегда видна. */
.wrap > * { flex-shrink: 0; } .wrap > .card.jc { flex-shrink: 1; min-height: 0; overflow: hidden; }
.l { color: var(--muted); font-size: 13px; }
.big { font: 300 40px/1 var(--display); letter-spacing: -.05em; font-variant-numeric: tabular-nums; margin: 0 0 8px; }
.caps { display: flex; gap: 4px; }
.cap { min-width: 0; height: 28px; border-radius: 999px; padding: 0 10px; display: flex; align-items: center; gap: 6px; overflow: hidden; white-space: nowrap; font-size: 11px; }
.cap b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.cap span { margin-left: auto; font-variant-numeric: tabular-nums; }
.cap.task { background: var(--p); color: var(--on-pastel); }
.cap.wait { box-shadow: inset 0 0 0 1.5px var(--warn); color: var(--warn); }
.cap.skip { background: repeating-linear-gradient(135deg, var(--well) 0 2px, transparent 2px 6px); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.track { position: relative; height: 18px; border-radius: 7px; background: var(--well); }
.b { position: absolute; top: 5px; bottom: 5px; border-radius: 4px; }
.b.wait { background: color-mix(in srgb, var(--warn) 18%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 70%, transparent); }
.b.skip { background: var(--skip); opacity: .6; }
.b.split { background: var(--soft); }
.b.hint { background: color-mix(in srgb, var(--c) 25%, transparent); box-shadow: inset 0 0 0 1px var(--c); }
.now { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 2px; background: var(--blue); }
.h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.h b { font: 600 15px var(--display); letter-spacing: -.01em; }
.h .jv { font: 300 22px var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.h .n { font: 600 12px var(--text); padding: 2px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
.row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.no { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--well); color: var(--muted); display: grid; place-items: center; flex: none; }
.no svg { width: 14px; height: 14px; }
.row + .row { border-top: 1px solid var(--line); }
.ico { width: 26px; height: 26px; border-radius: 7px; flex: none; }

.row .t { flex: 1; min-width: 0; }

.row .d { font: 300 20px var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.yes { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none; }
.yes svg { width: 15px; height: 15px; }
.go { height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--well); font-size: 12px; flex: none; }

.pill.soft { background: var(--well); color: var(--ink); font-weight: 500; }
.more { font-size: 12px; color: var(--muted); padding-top: 2px; }
.yday { display: flex; align-items: center; gap: 10px; }
.yday .t { flex: 1; } .yday b { font-weight: 600; }
.yday .s { font-size: 12px; color: var(--warn); }
.yday .s.ok { color: var(--ok); }
.foot { margin-top: auto; display: flex; gap: 8px; flex: none; }  /* «Открыть таймлайн» всегда внизу и видна */
.open { flex: 1; height: 42px; border-radius: 999px; border: 0; background: var(--card); color: var(--ink); font: 600 15px var(--display); display: flex; align-items: center;
  justify-content: space-between; padding: 0 6px 0 18px; }
.open i { width: 34px; height: 34px; border-radius: 50%; background: var(--well); color: var(--ink); display: grid; place-items: center; }
.open svg { width: 15px; height: 15px; }
.circle { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--card); display: grid; place-items: center; color: var(--muted); }
.circle svg { width: 18px; height: 18px; }
.menu { position: fixed; z-index: 9; background: var(--card); border-radius: 16px; padding: 6px; box-shadow: 0 12px 34px rgba(0,0,0,.22); display: none; min-width: 200px; }
.menu.show { display: block; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 10px; font-size: 13px; }
.menu button:hover { background: var(--well); }
.menu button { display: flex; align-items: center; gap: 10px; }
.menu button i { display: grid; place-items: center; width: 18px; color: var(--muted); flex: none; } .menu button i svg { width: 17px; height: 17px; }
.menu button:hover i { color: var(--ink); }
.menu .hr { height: 1px; background: var(--line); margin: 4px 6px; }
.empty { color: var(--muted); font-size: 13px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { position: relative; height: 32px; border-radius: 999px; border: 0; background: var(--card); color: var(--ink); font-size: 12px; }
.day.sel { background: var(--blue); color: #fff; font-weight: 600; }
.day i { position: absolute; top: 5px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.day.sel i { background: #fff; }
.day.future { display: grid; place-items: center; color: var(--soft); background: transparent; opacity: .6; }
.jt { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.jt + .jt { border-top: 1px solid var(--line); }
.jt i { width: 10px; height: 10px; border-radius: 3px; background: var(--p); flex: none; }
.jt .k { font: 700 12px var(--text); }
.jt .s { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jt .v { font: 300 18px var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.log { margin-top: 8px; width: 100%; height: 40px; border-radius: 999px; border: 0; background: var(--blue); color: #fff; font: 600 14px var(--display); }
.log.confirm { background: var(--warn); }
.log:disabled { background: var(--well); color: var(--muted); }
.jmsg { margin-top: 8px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="menu" id="menu"></div>

/* Нативное приложение даёт мост tt; в браузере — обычные ссылки. */
const native = (msg) => { if (window.webkit?.messageHandlers?.tt) { window.webkit.messageHandlers.tt.postMessage(msg); return true; } return false; };
const openDay = date => native({ action: "open", date }) || window.open("/?date=" + date, "_blank");

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json", "X-TT": "1" }, body: JSON.stringify(body) } : {});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;

const S = { date: iso(new Date()) };
// S.today — открытый в панели день (по умолчанию сегодня); капсулы недели переключают его.
async function load(date) {
  if (date) S.date = date;
  const [day, week, st, issues] = await Promise.all([api("/api/day?date=" + S.date), api("/api/week?date=" + S.date), api("/api/status"), api("/api/issues").catch(() => [])]);
  // Приложение обновилось, а панель всё ещё держит старую страницу — перезагружаемся.
  if (S.build && st.build && st.build !== S.build) return location.reload();
  S.build = st.build;
  Object.assign(S, { day, week, st, issues, today: S.date }); render();
}
const summary = k => (S.issues.find(i => i.key === k) || {}).summary || "";

function slots(day) {
  const secs = {}; for (const b of day.blocks) { const k = b.issue || (b.hint || {}).issue || (b.suggestion || {}).issue; if (k) secs[k] = (secs[k] || 0) + b.seconds; }

}

function waits(day) {
  const m = new Map();

const icon = (b, l) => b ? `<img class="ico" src="/api/icon?b=${encodeURIComponent(b)}" onerror="this.outerHTML='<span class=&quot;ico ph&quot;>${esc((l || "?").replace(/^Claude Code: /, "")[0] || "?")}</span>'">`

function render() {
  const { day, week, st } = S, p = day.proposal; slots(day);

      const cls = b.issue ? "" : b.skip ? "skip" : b.split ? "split" : sg ? "hint" : "wait";

  }
  const ws = waits(day), withSug = ws.filter(g => g.sug);
  // Капсулы недели: быстрый переход по дням прямо в панели.
  const now = iso(new Date()), WDS = ["вс", "пн", "вт", "ср", "чт", "пт", "сб"];
  const weekRow = `<div class="days">${week.map(w => { const d = new Date(w.date + "T12:00"), lab = WDS[d.getDay()];
    if (w.future) return `<span class="day future">${lab}</span>`;
    const ok = w.total && (w.status === "manual" || (!w.needs_review && w.pushed));
    return `<button class="day ${w.date === S.date ? "sel" : ""}" data-day="${w.date}" title="${w.total ? hmm(w.total) : "нет записи"}${ok ? " · в Jira" : ""}">${lab}${ok ? "<i></i>" : ""}</button>`; }).join("")}</div>`;
  const dd = new Date(S.date + "T12:00"), title = S.date === now ? "Сегодня"
    : ["Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"][dd.getDay()] + ", " + dd.getDate();
  $("#app").innerHTML = `
    <div class="top"><div class="brand">${LOGO}<span>tracker</span></div><span class="sp"></span>
      <button class="rec ${st.paused ? "paused" : ""}" id="rec"><i></i>${pausedText}${CHEV}</button></div>
    ${(st.missing || []).slice(0, 1).map(m => `<div class="card access" title="${esc(m.text)}"><b>${esc(m.title)}${st.missing.length > 1 ? ` <span>и ещё ${st.missing.length - 1}</span>` : ""}</b>
      <button class="pill" id="access">${esc(m.button)}</button></div>`).join("")}
    ${st.update?.newer && !(st.missing || []).length ? `<div class="card access upd"><b>Доступна версия ${esc(st.update.latest)}</b><button class="pill" id="updW">Обновить</button></div>` : ""}
    ${weekRow}
    <div class="card"><div class="l">${title}</div><div class="big">${hmm(p.total)}</div>
      ${day.blocks.length ? "" : `<div class="empty">Пока ничего не записано</div>`}
      ${ribbon}</div>
    ${ws.length ? `<div class="card"><div class="h"><b>Ждут решения</b><span class="n">${ws.length}</span><span class="sp"></span>
        ${withSug.length > 1 ? `<button class="pill soft" id="all">Принять ${withSug.length}</button>` : ""}</div>
      ${ws.slice(0, 2).map((g, i) => `<div class="row">${icon(g.icon, g.label)}<div class="t"><div class="nm">${esc(g.label.replace(/^Claude Code: /, ""))}</div>
        <div class="sg">${g.sug ? `похоже на <b>${esc(g.sug.issue)}</b> ${esc(summary(g.sug.issue))}` : "задача не определена"}</div></div>
        <span class="d">${hmm(g.sec)}</span>${g.sug ? `<button class="yes" data-acc="${i}" title="Записать в ${esc(g.sug.issue)}">${CHECK}</button>` : ""}
        <button class="no" data-no="${i}" title="Не та задача, личное или поделить">${DOTS}</button></div>`).join("")}
      ${ws.length > 2 ? `<div class="more">и ещё ${ws.length - 2} — в таймлайне</div>` : ""}</div>` : ""}
    ${jiraCard(p, Math.max(1, 4 - Math.min(2, ws.length) - ((st.missing || []).length || st.update?.newer ? 1 : 0)))}
    <div class="foot"><button class="open" data-open="${S.today}">Открыть таймлайн<i>${ARROW}</i></button>
      <button class="circle" id="more" title="Ещё"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="4" cy="10" r="1.7"/><circle cx="10" cy="10" r="1.7"/><circle cx="16" cy="10" r="1.7"/></svg></button></div>`;
  $$("[data-open]").forEach(b => b.onclick = () => openDay(b.dataset.open));
  $("#updW")?.addEventListener("click", () => native({ action: "update" }));
  if ($("#access")) $("#access").onclick = () => { const m = st.missing[0]; native({ action: m.action, bundle: m.bundle }); };
  $$("[data-day]").forEach(b => b.onclick = () => load(b.dataset.day));
  $$("[data-acc]").forEach(b => b.onclick = () => accept(ws[+b.dataset.acc]));
  $$("[data-no]").forEach(b => b.onclick = e => { const g = ws[+b.dataset.no];
    menu(e.currentTarget, [["Отметить как личное", () => mark(g, { skip: true }), "person"], ["Разделить между задачами", () => mark(g, { split: true }), "split"],
      null, ["Найти задачу в таймлайне", () => openDay(S.today), "search"]]); });
  $("#all")?.addEventListener("click", async () => { for (const g of withSug) await accept(g, true); load(); });
  $("#rec").onclick = e => menu(e.currentTarget, st.paused
    ? [["Продолжить запись", () => pause("resume"), "play"]]
    : [["Пауза на 30 минут", () => pause("30"), "clock"], ["Пауза на 1 час", () => pause("60"), "clock"], ["Пауза на 2 часа", () => pause("120"), "clock"],
       ["До конца дня", () => pause("eod"), "moon"], ["Пока не включу", () => pause("inf"), "pause"]]);
  $("#more").onclick = e => menu(e.currentTarget, [["Настройки", () => native({ action: "settings" }), "gear"], null,
    ["Выйти из 65 tracker", () => native({ action: "quit" }), "power"]], true);
}
// «Уйдёт в Jira» на сегодня: задачи и кнопка; первое нажатие спрашивает, второе логирует.
function jiraCard(p, rows = 3) {
  const wl = p.worklogs, pending = wl.filter(w => w.status === "draft" || w.status === "changed"), sec = pending.reduce((x, w) => x + w.seconds, 0);
  if (!wl.length) return "";
  setTimeout(() => { const b = $("#log"); if (!b) return; let armed = false;
    b.onclick = async () => {
      if (!armed) { armed = true; b.classList.add("confirm"); b.textContent = `Точно залогировать ${pending.length} ${plural(pending.length, "задачу", "задачи", "задач")}?`;
        setTimeout(() => { if (b.isConnected && armed) { armed = false; b.classList.remove("confirm"); b.textContent = `Залогировать · ${hmm(sec)}`; } }, 4000); return; }
      b.disabled = true; b.textContent = "Логирую…";
      try { const r = await api("/api/push", { date: S.today }); const errs = r.results.filter(x => x.action === "error");
        await load(); $("#jmsg") && ($("#jmsg").textContent = errs.length ? errs.map(x => `${x.issue}: ${x.error}`).join("; ") : "Залогировано в Jira"); }
      catch (e) { b.disabled = false; b.textContent = "Не вышло — ещё раз"; $("#jmsg").textContent = e.message; } };
  });
  return `<div class="card jc"><div class="h"><b>Уйдёт в Jira</b><span class="sp"></span><span class="jv">${hmm(wl.reduce((x, w) => x + w.seconds, 0))}</span></div>
    ${wl.slice(0, rows).map(w => `<div class="jt" style="--p:${pastel(w.issue)}"><i></i><span class="k">${esc(w.issue)}</span><span class="s">${esc(w.summary || summary(w.issue))}</span><span class="v">${hmm(w.seconds)}</span></div>`).join("")}
    ${wl.length > rows ? `<div class="more">и ещё ${wl.length - rows} — в таймлайне</div>` : ""}
    <button class="log" id="log" ${pending.length && S.day.jira_configured ? "" : "disabled"}>${!S.day.jira_configured ? "Jira не подключена" : pending.length ? `Залогировать · ${hmm(sec)}` : "Всё уже в Jira"}</button>
    <div class="jmsg" id="jmsg"></div></div>`;
}
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return iso(d); };
async function accept(g, quiet) {
  const intervals = g.blocks.filter(b => !g.sug.here || (b.hint && b.hint.here && b.hint.issue === g.sug.issue)).map(b => [b.start, b.end]);
  await api("/api/assign", g.sug.here ? { date: S.today, issue: g.sug.issue, intervals }
    : { date: S.today, issue: g.sug.issue, remember: true, context_key: g.blocks[0].context_key, label: g.label, intervals });
  if (!quiet) load();
}
// «Не то»: активность — личное или делится между задачами; запоминается на будущее.
async function mark(g, how) {
  await api("/api/assign", { date: S.today, ...how, remember: true, context_key: g.blocks[0].context_key, label: g.label, intervals: g.blocks.map(b => [b.start, b.end]) });
  load();
}
async function pause(mode) { S.st = await api("/api/pause", { mode }); native({ action: "refresh" }); render(); }
// Иконки пунктов меню — тот же контурный стиль, что в меню окна.
const MI = Object.fromEntries(Object.entries({
  back: '<path d="M8 5 3 10l5 5M3.5 10H13a4 4 0 0 1 4 4v1"/>',
  gear: '<path d="M3 6h7M14 6h3M3 14h3M10 14h7"/><circle cx="12" cy="6" r="2"/><circle cx="8" cy="14" r="2"/>',
  power: '<path d="M10 3v7"/><path d="M6 5.5a6 6 0 1 0 8 0"/>',
  person: '<circle cx="10" cy="7" r="3"/><path d="M4.5 17a5.5 5.5 0 0 1 11 0"/>',
  split: '<path d="M10 3v5M10 8l-5 5v4M10 8l5 5v4"/>',
  search: '<circle cx="9" cy="9" r="5"/><path d="m13 13 4 4"/>',
  clock: '<circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2"/>',
  moon: '<path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8Z"/>',
  pause: '<path d="M7.5 5v10M12.5 5v10"/>',
  play: '<path d="M7 5v10l8-5z"/>',
}).map(([k, d]) => [k, `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`]));
function menu(anchor, items, up) {
  const m = $("#menu"), r = anchor.getBoundingClientRect();
  m.innerHTML = items.map((it, i) => it ? `<button data-i="${i}">${it[2] ? `<i>${MI[it[2]]}</i>` : ""}${esc(it[0])}</button>` : `<div class="hr"></div>`).join("");
  m.classList.add("show");
  m.style.left = Math.min(r.left, innerWidth - m.offsetWidth - 10) + "px";
  const below = r.bottom + 6 + m.offsetHeight < innerHeight;
  m.style.top = (up || !below ? r.top - m.offsetHeight - 6 : r.bottom + 6) + "px";
  $$("button", m).forEach(b => b.onclick = () => { m.classList.remove("show"); items[+b.dataset.i][1](); });
}
document.addEventListener("click", e => { if (!e.target.closest("#menu, #rec, #more")) $("#menu").classList.remove("show"); });
// Пока висит плашка о доступе — перепроверяем каждые 2 с: приложение обновит состояние, панель перерисуется.
setInterval(async () => { if (!$("#access")) return; native({ action: "refresh" }); await new Promise(r => setTimeout(r, 300));
  try { S.st = await api("/api/status"); render(); } catch (e) {} }, 2000);
window.ttRefresh = () => load(iso(new Date()));  // при каждом открытии панели — снова сегодня
load().catch(e => { $("#app").innerHTML = `<div class="card empty">Не удалось загрузить: ${esc(e.message)}</div>`; });
</script>
</body>
